<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explain the Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Trail-guide theme: forest greens, earth browns, lake blue, rust. */
    :root { --bg: #f7f3ea; --fg: #23261f; --muted: #66685c; --line: #d8d0bf; --accent: #2f6b45; --up: #b4532a; --down: #2b6a9a;
      --card: #efe8da; --paper: #fffcf3; --sign: #6b4a2b; --sign-fg: #fbf3e2; --sky: #dde9e4; --mtn1: #9fb8a4; --mtn2: #5f8a6b; --mtn3: #2f5a3f;
      --heading: "Bitter", Georgia, serif; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161a16; --fg: #ebe9e0; --muted: #a8a99c; --line: #353b33; --accent: #7cc49a; --up: #e9875c; --down: #6fb2e3;
        --card: #20261f; --paper: #1d201b; --sign: #7a5634; --sign-fg: #fbf3e2; --sky: #1b2621; --mtn1: #2c3d33; --mtn2: #24382b; --mtn3: #1a2b20; }
    }
    * { box-sizing: border-box; }
    input[type=range] { accent-color: var(--accent); }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 "Source Sans 3", system-ui, sans-serif; }
    h1, h2, h3 { font-family: var(--heading); }
    h2 { font-size: 26px; line-height: 1.25; margin: 28px 0 12px; }
    .banner { background: var(--sky); position: relative; overflow: hidden; }
    .banner-inner { max-width: 900px; margin: 0 auto; padding: 28px 16px 92px; position: relative; z-index: 1; }
    .banner h1 { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -.01em; }
    .banner .tagline { margin: 4px 0 0; color: var(--muted); font-size: 17px; }
    .banner svg.ridge { position: absolute; left: 0; bottom: 0; width: 100%; height: 110px; display: block; }
    .trailhead { max-width: 900px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 2; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: -54px; }
    nav a { display: inline-flex; flex-direction: column; background: var(--sign); color: var(--sign-fg); text-decoration: none;
      padding: 8px 30px 8px 14px; border-radius: 4px; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
      font-family: var(--heading); font-weight: 700; line-height: 1.2; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); opacity: .82; }
    nav a small { font-family: "Source Sans 3", system-ui, sans-serif; font-weight: 600; font-size: 12px; opacity: .85; letter-spacing: .03em; }
    nav a:hover { opacity: 1; }
    nav a.active { opacity: 1; background: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { nav a.active { color: #10180f; } }
    header, main { max-width: 900px; margin: 0 auto; padding: 16px; }
    header.banner { max-width: none; padding: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0 0; padding: 12px 14px; background: var(--card);
      border: 1px solid var(--line); border-radius: 8px; align-items: center; }
    .controls .ctl-title { font-family: var(--heading); font-weight: 700; margin-right: 4px; }
    select, input { font: inherit; padding: 4px 6px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    td, th { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); }
    .note { color: var(--muted); font-size: 14px; }
    .starter { background: var(--card); border: 1px dashed var(--line); padding: 8px 12px; border-radius: 8px; }
    .inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .inputs label { display: flex; flex-direction: column; font-size: 14px; }
    svg { width: 100%; height: auto; }
    button { font: inherit; padding: 6px 12px; margin-top: 12px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    h3 { margin: 0 0 8px; font-size: 17px; }
    .lead { font-size: 17px; }
    .panel { margin: 24px 0; }
    .linear-grid { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); gap: 24px; margin: 24px 0; }
    @media (max-width: 700px) { .linear-grid { grid-template-columns: 1fr; } }
    .inputs.one-col { grid-template-columns: 1fr; }
    .receipt { background: var(--paper); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .r-head { text-align: center; font-weight: 700; letter-spacing: .04em; padding-bottom: 10px; border-bottom: 2px dashed var(--line); }
    .r-line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dotted var(--line); }
    .r-item { flex: 1; }
    .r-amt { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .r-detail { font-family: system-ui, sans-serif; font-size: 12.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
    .r-start { font-weight: 700; }
    .r-sub { color: var(--muted); padding: 8px 0 0; font-size: 13px; }
    .r-total { border-top: 2px dashed var(--line); border-bottom: none; font-size: 17px; font-weight: 700; margin-top: 4px; }
    .r-sum { font-size: 13px; padding-top: 8px; border-top: 1px dotted var(--line); overflow-wrap: anywhere; }
    .tag { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; color: #fff; padding: 1px 6px; border-radius: 10px; margin-left: 4px; white-space: nowrap; }
    .up-bg { background: var(--up); } .down-bg { background: var(--down); }
    .two-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 700px) { .two-cards { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 15px; }
    .card > strong:first-child { display: block; margin-bottom: 4px; }
    .callout { background: var(--card); border-left: 4px solid var(--accent); padding: 10px 12px; border-radius: 4px; }
    .t-row { display: grid; grid-template-columns: minmax(140px, 2fr) 3fr minmax(90px, auto); gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .t-bar { background: var(--card); height: 14px; border-radius: 3px; overflow: hidden; }
    .t-bar span { display: block; height: 100%; }
    .t-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .slider { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 12px; font-size: 17px; }
    .slider input[type=range] { flex: 1; min-width: 160px; padding: 0; }
    .forest-layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(240px, 2fr); gap: 20px; align-items: start; }
    @media (max-width: 760px) { .forest-layout { grid-template-columns: 1fr; } }
    .judges { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
    @media (max-width: 520px) { .judges { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .judge { --tint: 0%; border: 1px solid var(--line); border-radius: 6px; padding: 3px 2px; text-align: center; background: var(--card);
      transition: opacity .15s, filter .15s; font-variant-numeric: tabular-nums; }
    .judge.hi { background: color-mix(in srgb, var(--up) var(--tint), var(--card)); }
    .judge.lo { background: color-mix(in srgb, var(--down) var(--tint), var(--card)); }
    .judge.off { opacity: .22; filter: grayscale(1); }
    .j-tree { display: block; font-size: 10px; color: var(--muted); }
    .j-score { display: block; font-size: 13px; font-weight: 700; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; }
    .swatch.hi { background: var(--up); } .swatch.lo { background: var(--down); }
    .scoreboard { background: var(--fg); color: var(--bg); border-radius: 10px; padding: 14px 16px; }
    .scoreboard table { margin: 8px 0 0; font-size: 14px; }
    .scoreboard .num { white-space: nowrap; padding-left: 8px; }
    .scoreboard td, .scoreboard th { border-color: color-mix(in srgb, var(--bg) 25%, transparent); padding: 4px 0; }
    .sb-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; opacity: .8; }
    .sb-score { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 4px 0; }
    .sb-score span { font-size: 18px; font-weight: 600; }
    .sb-math { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; opacity: .85; }
    #settle { margin-top: 12px; }
    .roots { margin: 4px 0 0; padding-left: 22px; font-size: 14px; }
    .trace { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .trace summary { cursor: pointer; font-weight: 600; }
    button[data-goto] { margin: 4px 8px 4px 0; }
    :root { --trail: #2f7d4f; --mtn-top: #c9b79c; --mtn-bottom: #efe7da; }
    @media (prefers-color-scheme: dark) { :root { --trail: #5cc98a; --mtn-top: #6b5a45; --mtn-bottom: #2a241d; } }
    .step-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .step-controls button { margin-top: 0; }
    .step-controls .slider { flex: 1; margin: 0; }
    .boost-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 12px; align-items: start; }
    @media (max-width: 760px) { .boost-layout { grid-template-columns: 1fr; } }
    .step-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    .step-box p { margin: 8px 0 0; }
    .step-big { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .step-big span { font-size: 17px; font-weight: 600; }
    .step-eq > div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
    .step-eq .step-total { border-top: 2px solid var(--fg); border-bottom: none; font-weight: 800; font-size: 18px; }
    .step-v { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
    .step-gap { font-size: 14px; color: var(--muted); }
    .mini-log { font-size: 13px; margin-top: 10px; }
    .mini-log tr.cur td { font-weight: 700; }
    .mini-log th.num { text-align: right; }
    .legend-list { list-style: none; padding: 0; margin: 8px 0; }
    .legend-list li { margin: 4px 0; }
    .key { display: inline-block; width: 26px; height: 0; vertical-align: middle; margin-right: 6px; }
    .key-train { border-top: 3px dashed var(--muted); } .key-val { border-top: 3px solid var(--trail); }
    .zoom button { margin: 4px 6px 8px 0; }
    .zoom button.active { border-color: var(--fg); font-weight: 700; }
    .verdict { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    .v-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 14px; color: var(--muted); }
    .v-nums > div > span { display: block; }
    .v-big { font-size: 26px; font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header class="banner">
    <div class="banner-inner">
      <h1>Explain the Model</h1>
      <p class="tagline">A trail guide to how three regression models turn a person's health data into a prediction</p>
    </div>
    <svg class="ridge" viewBox="0 0 1200 110" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70 L120 30 L230 62 L360 18 L470 58 L600 26 L720 64 L850 22 L980 60 L1090 34 L1200 56 L1200 110 L0 110 Z" fill="var(--mtn1)"/>
      <path d="M0 88 L150 52 L280 84 L420 46 L560 86 L700 50 L830 88 L960 54 L1100 86 L1200 66 L1200 110 L0 110 Z" fill="var(--mtn2)"/>
      <path d="M0 110 L0 98 L200 80 L380 100 L560 84 L760 102 L940 86 L1200 100 L1200 110 Z" fill="var(--mtn3)"/>
    </svg>
  </header>
  <div class="trailhead">
    <nav aria-label="Sections">
      <a href="#linear"><small>TRAIL 1 · LINEAR REGRESSION</small>Push &amp; Pull</a>
      <a href="#forest"><small>TRAIL 2 · RANDOM FOREST</small>Wisdom of the Forest</a>
      <a href="#boosting"><small>TRAIL 3 · GRADIENT BOOSTING</small>One Correction at a Time</a>
    </nav>
    <div class="controls">
      <span class="ctl-title">🥾 Trailhead:</span>
      <label>Dataset <select id="dataset"></select></label>
      <label>Example person <select id="person"></select></label>
    </div>
  </div>
  <main id="section"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
